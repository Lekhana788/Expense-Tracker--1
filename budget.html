<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Budget</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-content">
            <button id="backBtn" class="btn-icon">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2>Budget Management</h2>
            <button id="addBudgetBtn" class="btn-icon">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <!-- SUMMARY CARD -->
        <div class="budget-summary-card">
            <div class="budget-summary-item">
                <div>
                    <p>Monthly Budget</p>
                    <h3 id="totalBudgetMonthly">₹ 0</h3>
                </div>
                <div class="icon-box">
                    <i class="fas fa-wallet"></i>
                </div>
            </div>
            <div class="budget-summary-item">
                <div>
                    <p>Yearly Budget</p>
                    <h3 id="totalBudgetYearly">₹ 0</h3>
                </div>
                <div class="icon-box">
                    <i class="fas fa-calendar-alt"></i>
                </div>
            </div>
            <div class="budget-summary-item">
                <div>
                    <p>Total Spent</p>
                    <h3 id="totalBudgetSpent">₹ 0</h3>
                </div>
                <div class="icon-box warning">
                    <i class="fas fa-arrow-down"></i>
                </div>
            </div>
            <div class="budget-summary-item">
                <div>
                    <p>Remaining</p>
                    <h3 id="totalBudgetRemaining">₹ 0</h3>
                </div>
                <div class="icon-box success">
                    <i class="fas fa-check"></i>
                </div>
            </div>
        </div>

        <div class="budget-total-summary">
            <p>Total Budget Across All Categories</p>
            <h3 id="combinedBudgetText">₹ 0 monthly / ₹ 0 yearly</h3>
        </div>

        <!-- BUDGETS LIST -->
        <div class="budgets-container">
            <div class="section-header">
                <h3>Category Budgets</h3>
            </div>
            <div id="budgetsList" class="budgets-list">
                <!-- Generated by JavaScript -->
            </div>
        </div>

        <div style="height: 100px;"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="add.html" class="nav-item" data-page="add">
            <i class="fas fa-plus"></i>
            <span>Add</span>
        </a>
        <a href="report.html" class="nav-item" data-page="report">
            <i class="fas fa-chart-bar"></i>
            <span>Reports</span>
        </a>
        <a href="profile.html" class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- ADD BUDGET MODAL -->
    <div id="addBudgetModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Set Budget</h3>
                <button id="closeBudgetModal" class="btn-icon">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addBudgetForm" class="form-container">
                <div class="form-group">
                    <label for="budgetCategory">Category</label>
                    <select id="budgetCategory" required>
                        <option value="">Select a category</option>
                        <option value="food">🍔 Food & Dining</option>
                        <option value="transport">🚗 Transport</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="utilities">💡 Utilities</option>
                        <option value="entertainment">🎬 Entertainment</option>
                        <option value="health">⚕️ Health</option>
                        <option value="education">📚 Education</option>
                        <option value="other">📌 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budgetAmount">Budget Amount</label>
                    <div class="amount-input-wrapper">
                        <span class="currency-symbol">₹</span>
                        <input type="number" id="budgetAmount" placeholder="0.00" step="0.01" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="budgetFrequency">Budget Frequency</label>
                    <select id="budgetFrequency" required>
                        <option value="monthly" selected>Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budgetAlert">Alert Threshold (%)</label>
                    <input type="number" id="budgetAlert" value="80" min="0" max="100" placeholder="80">
                    <small>Get alert when you reach this percentage of budget</small>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelBudgetBtn" class="btn btn-secondary btn-full">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-full">Set Budget</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeBudgetPage();
        });
    </script>
</body>

</html>
