<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Reports</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-content">
            <button id="backBtn" class="btn-icon">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2>Reports</h2>
            <div style="width: 40px;"></div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <!-- SUMMARY CARD -->
        <div class="summary-card">
            <div class="summary-item">
                <div>
                    <p>Total Expenses</p>
                    <h3 id="reportTotalExpense">₹ 0</h3>
                </div>
                <div class="icon-box">
                    <i class="fas fa-arrow-down"></i>
                </div>
            </div>
            <div class="summary-item">
                <div>
                    <p>Total Entries</p>
                    <h3 id="reportTotalCount">0</h3>
                </div>
                <div class="icon-box">
                    <i class="fas fa-receipt"></i>
                </div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filters-section">
            <div class="filter-group">
                <label for="filterCategory">Filter by Category</label>
                <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="food">🍔 Food & Dining</option>
                    <option value="transport">🚗 Transport</option>
                    <option value="shopping">🛍️ Shopping</option>
                    <option value="utilities">💡 Utilities</option>
                    <option value="entertainment">🎬 Entertainment</option>
                    <option value="health">⚕️ Health</option>
                    <option value="education">📚 Education</option>
                    <option value="other">📌 Other</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sortBy">Sort By</label>
                <select id="sortBy">
                    <option value="recent">Most Recent</option>
                    <option value="oldest">Oldest First</option>
                    <option value="highest">Highest Amount</option>
                    <option value="lowest">Lowest Amount</option>
                </select>
            </div>
        </div>

        <!-- EXPENSES LIST -->
        <div class="expenses-container">
            <div class="section-header">
                <h3>All Expenses</h3>
                <span id="expenseCount" class="badge">0</span>
            </div>
            <div id="expensesList" class="expenses-list">
                <!-- Generated by JavaScript -->
            </div>
        </div>

        <div style="height: 80px;"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="add.html" class="nav-item" data-page="add">
            <i class="fas fa-plus"></i>
            <span>Add</span>
        </a>
        <a href="report.html" class="nav-item active" data-page="report">
            <i class="fas fa-chart-bar"></i>
            <span>Reports</span>
        </a>
        <a href="profile.html" class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeReportPage();
        });
    </script>
</body>

</html>
