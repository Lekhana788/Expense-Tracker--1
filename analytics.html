<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Analytics</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-content">
            <button id="backBtn" class="btn-icon">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2>Analytics & Insights</h2>
            <div style="width: 40px;"></div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <!-- FILTERS -->
        <div class="analytics-filters">
            <select id="analyticsMonth">
                <option value="current">Current Month</option>
                <option value="last3">Last 3 Months</option>
                <option value="last6">Last 6 Months</option>
                <option value="last12">Last 12 Months</option>
                <option value="all">All Time</option>
            </select>
        </div>

        <!-- KEY INSIGHTS -->
        <div class="insights-section">
            <h3>Key Insights</h3>
            <div class="insights-grid">
                <div class="insight-card">
                    <div class="insight-header">
                        <i class="fas fa-arrow-up"></i>
                        <span>Highest Expense</span>
                    </div>
                    <p id="highestExpense">₹ 0</p>
                    <small id="highestExpenseInfo">-</small>
                </div>

                <div class="insight-card">
                    <div class="insight-header">
                        <i class="fas fa-arrow-down"></i>
                        <span>Average Per Day</span>
                    </div>
                    <p id="averagePerDay">₹ 0</p>
                    <small>Daily spending average</small>
                </div>

                <div class="insight-card">
                    <div class="insight-header">
                        <i class="fas fa-chart-line"></i>
                        <span>Trend</span>
                    </div>
                    <p id="spendingTrend">-</p>
                    <small id="trendInfo">-</small>
                </div>

                <div class="insight-card">
                    <div class="insight-header">
                        <i class="fas fa-crown"></i>
                        <span>Top Category</span>
                    </div>
                    <p id="topCategory">-</p>
                    <small id="topCategoryAmount">-</small>
                </div>
            </div>
        </div>

        <!-- CHARTS -->
        <div class="charts-grid">
            <!-- MONTHLY TREND -->
            <div class="chart-card">
                <h3>Monthly Spending Trend</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- CATEGORY BREAKDOWN -->
            <div class="chart-card">
                <h3>Category Breakdown</h3>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- COMPARISON -->
        <div class="comparison-section">
            <h3>Month-over-Month Comparison</h3>
            <div class="comparison-cards">
                <div class="comparison-card">
                    <p>Current Month</p>
                    <h3 id="currentMonthTotal">₹ 0</h3>
                </div>
                <div class="comparison-icon">
                    <i class="fas fa-arrow-right"></i>
                </div>
                <div class="comparison-card">
                    <p>Previous Month</p>
                    <h3 id="previousMonthTotal">₹ 0</h3>
                </div>
            </div>
            <div class="comparison-result" id="comparisonResult"></div>
        </div>

        <!-- RECOMMENDATIONS -->
        <div class="recommendations-section">
            <h3>Recommendations</h3>
            <div id="recommendationsList" class="recommendations-list">
                <!-- Generated by JavaScript -->
            </div>
        </div>

        <!-- EXPORT -->
        <div class="export-section">
            <button id="exportPdfBtn" class="btn btn-primary btn-full">
                <i class="fas fa-file-pdf"></i>
                Export as PDF
            </button>
            <button id="printReportBtn" class="btn btn-secondary btn-full" style="margin-top: 12px;">
                <i class="fas fa-print"></i>
                Print Report
            </button>
        </div>

        <div style="height: 100px;"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="add.html" class="nav-item" data-page="add">
            <i class="fas fa-plus"></i>
            <span>Add</span>
        </a>
        <a href="report.html" class="nav-item" data-page="report">
            <i class="fas fa-chart-bar"></i>
            <span>Reports</span>
        </a>
        <a href="profile.html" class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeAnalyticsPage();
        });
    </script>
</body>

</html>
