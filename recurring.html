<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Recurring</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-content">
            <button id="backBtn" class="btn-icon">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2>Recurring Expenses</h2>
            <button id="addRecurringBtn" class="btn-icon">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <!-- SUMMARY CARD -->
        <div class="recurring-summary-card">
            <div class="recurring-summary-item">
                <div>
                    <p>Monthly Recurring</p>
                    <h3 id="monthlyRecurring">₹ 0</h3>
                </div>
                <div class="icon-box">
                    <i class="fas fa-repeat"></i>
                </div>
            </div>
            <div class="recurring-summary-item">
                <div>
                    <p>Active Subscriptions</p>
                    <h3 id="activeSubscriptions">0</h3>
                </div>
                <div class="icon-box">
                    <i class="fas fa-list"></i>
                </div>
            </div>
            <div class="recurring-summary-item">
                <div>
                    <p>Yearly Impact</p>
                    <h3 id="yearlyImpact">₹ 0</h3>
                </div>
                <div class="icon-box">
                    <i class="fas fa-calendar"></i>
                </div>
            </div>
        </div>

        <!-- RECURRING LIST -->
        <div class="recurring-container">
            <div class="section-header">
                <h3>Your Subscriptions</h3>
            </div>
            <div id="recurringList" class="recurring-list">
                <!-- Generated by JavaScript -->
            </div>
        </div>

        <div style="height: 100px;"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="add.html" class="nav-item" data-page="add">
            <i class="fas fa-plus"></i>
            <span>Add</span>
        </a>
        <a href="report.html" class="nav-item" data-page="report">
            <i class="fas fa-chart-bar"></i>
            <span>Reports</span>
        </a>
        <a href="profile.html" class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- ADD RECURRING MODAL -->
    <div id="addRecurringModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Recurring Expense</h3>
                <button id="closeRecurringModal" class="btn-icon">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addRecurringForm" class="form-container">
                <div class="form-group">
                    <label for="recurringTitle">Expense Name</label>
                    <input type="text" id="recurringTitle" placeholder="e.g., Netflix, Gym Membership" required>
                </div>

                <div class="form-group">
                    <label for="recurringAmount">Amount</label>
                    <div class="amount-input-wrapper">
                        <span class="currency-symbol">₹</span>
                        <input type="number" id="recurringAmount" placeholder="0.00" step="0.01" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="recurringCategory">Category</label>
                    <select id="recurringCategory" required>
                        <option value="">Select a category</option>
                        <option value="food">🍔 Food & Dining</option>
                        <option value="transport">🚗 Transport</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="utilities">💡 Utilities</option>
                        <option value="entertainment">🎬 Entertainment</option>
                        <option value="health">⚕️ Health</option>
                        <option value="education">📚 Education</option>
                        <option value="other">📌 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="recurringFrequency">Frequency</label>
                    <select id="recurringFrequency" required>
                        <option value="weekly">Weekly</option>
                        <option value="monthly" selected>Monthly</option>
                        <option value="quarterly">Quarterly (3 months)</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="recurringStartDate">Start Date</label>
                    <input type="date" id="recurringStartDate" required>
                </div>

                <div class="form-group">
                    <label for="recurringEndDate">End Date (Optional)</label>
                    <input type="date" id="recurringEndDate">
                    <small>Leave empty if this expense continues indefinitely</small>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelRecurringBtn" class="btn btn-secondary btn-full">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-full">Add Subscription</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeRecurringPage();
        });
    </script>
</body>

</html>
