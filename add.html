<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Add Expense</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-content">
            <button id="backBtn" class="btn-icon">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2>Add Expense</h2>
            <div style="width: 40px;"></div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <form id="addExpenseForm" class="form-container">
            <!-- AMOUNT INPUT -->
            <div class="form-group">
                <label for="expenseAmount">Amount <span class="required">*</span></label>
                <div class="amount-input-wrapper">
                    <span class="currency-symbol">₹</span>
                    <input type="number" id="expenseAmount" placeholder="0.00" step="0.01" min="0" required>
                </div>
            </div>

            <!-- TITLE INPUT -->
            <div class="form-group">
                <label for="expenseTitle">Title <span class="required">*</span></label>
                <input type="text" id="expenseTitle" placeholder="e.g., Grocery Shopping, Fuel, etc." required>
            </div>

            <!-- CATEGORY SELECT -->
            <div class="form-group">
                <label for="expenseCategory">Category <span class="required">*</span></label>
                <select id="expenseCategory" required>
                    <option value="">Select a category</option>
                    <option value="food">🍔 Food & Dining</option>
                    <option value="transport">🚗 Transport</option>
                    <option value="shopping">🛍️ Shopping</option>
                    <option value="utilities">💡 Utilities</option>
                    <option value="entertainment">🎬 Entertainment</option>
                    <option value="health">⚕️ Health</option>
                    <option value="education">📚 Education</option>
                    <option value="other">📌 Other</option>
                </select>
            </div>

            <!-- DATE INPUT -->
            <div class="form-group">
                <label for="expenseDate">Date <span class="required">*</span></label>
                <input type="date" id="expenseDate" required>
            </div>

            <!-- DESCRIPTION INPUT -->
            <div class="form-group">
                <label for="expenseDescription">Description (Optional)</label>
                <textarea id="expenseDescription" placeholder="Add notes about this expense..." rows="4"></textarea>
            </div>

            <!-- FORM ACTIONS -->
            <div class="form-actions">
                <button type="button" id="cancelBtn" class="btn btn-secondary btn-full">
                    <i class="fas fa-times"></i>
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-check"></i>
                    Add Expense
                </button>
            </div>
        </form>

        <div style="height: 60px;"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="add.html" class="nav-item active" data-page="add">
            <i class="fas fa-plus"></i>
            <span>Add</span>
        </a>
        <a href="report.html" class="nav-item" data-page="report">
            <i class="fas fa-chart-bar"></i>
            <span>Reports</span>
        </a>
        <a href="profile.html" class="nav-item" data-page="profile">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeAddExpensePage();
        });
    </script>
</body>

</html>
